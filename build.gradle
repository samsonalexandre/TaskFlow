plugins {
    id 'java'
    id 'application'
}

group = 'de.samson_elektronik'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.xerial:sqlite-jdbc:3.53.2.1'

    // OpenCSV: robustes CSV-Lesen/Schreiben (Quoting, Escaping, Zeilenumbrüche
    // innerhalb von Feldern) statt fehleranfälligem manuellem String.split()
    implementation 'com.opencsv:opencsv:5.11.2'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

application {
    mainClass = 'de.samson_elektronik.gui.MainFrame'
}